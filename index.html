<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Tiger UX Dashboard</title>

<link rel="stylesheet" href="css/style.css">

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

</head>

<body>

<div class="sidebar">

    <h2>Tiger UX</h2>

    <ul>
        <li>Dashboard</li>
        <li>Analytics</li>
        <li>Users</li>
        <li>Settings</li>
    </ul>

</div>

<div class="main">

    <div class="topbar">
        <h1>AI Dashboard</h1>
    </div>

    <div class="cards">

        <div class="card">
            <h3>Users</h3>
            <p>12,430</p>
        </div>

        <div class="card">
            <h3>Revenue</h3>
            <p>$84,200</p>
        </div>

        <div class="card">
            <h3>Traffic</h3>
            <p>1.2M</p>
        </div>

    </div>

    <div class="chart-box">
        <canvas id="myChart"></canvas>
    </div>

</div>

<script src="js/app.js"></script>

</body>
</html>
